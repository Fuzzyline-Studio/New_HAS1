name: Compile altar
# Link check only: a public placeholder OTA key and blackbox credential. Never deploy.
on:
  pull_request:
    paths:
      - 'devices/HAS1_altar/**'
      - 'libraries/HAS1BlackBox/**'
      - 'scripts/firmware_targets.py'
      - '.github/workflows/compile-altar.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  ESP32_CORE_VERSION: "3.3.11"
  ESP32_BOARD_INDEX: "https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"
  # Same pinned revision as deploy-firmware.yml.
  SECUREOTA_REVISION: "162db758e6806895ef10ca39b101f9f8753bdc20"
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blackbox: [mqtt, flash]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned core and registry dependencies
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index --additional-urls "$ESP32_BOARD_INDEX"
          n=0
          until arduino-cli core install "esp32:esp32@$ESP32_CORE_VERSION" --additional-urls "$ESP32_BOARD_INDEX"; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then exit 1; fi
            sleep 15
          done
          arduino-cli lib install \
            "Adafruit NeoPixel@1.12.0" \
            "Adafruit PN532@1.3.4" \
            "Adafruit BusIO@1.17.4" \
            "ArduinoJson@7.4.3" \
            "DFRobotDFPlayerMini@1.0.6" \
            "ESP32Encoder@5.0.0" \
            "EspSoftwareSerial@8.1.0"
      - name: Prepare the same custom libraries as the altar deployment
        run: |
          LIB_DIR="$HOME/Arduino/libraries"
          mkdir -p "$LIB_DIR"
          git init --quiet "$LIB_DIR/SecureOTA"
          git -C "$LIB_DIR/SecureOTA" remote add origin https://github.com/Fuzzyline-HAS2/SecureOTA
          git -C "$LIB_DIR/SecureOTA" fetch --quiet --depth 1 --no-tags origin "$SECUREOTA_REVISION"
          git -C "$LIB_DIR/SecureOTA" checkout --quiet --detach FETCH_HEAD
          # The altar deploys with the shared first_store HAS2_Wifi, not the repository copy.
          git clone --depth 1 --branch first_store https://github.com/Fuzzyline-HAS/libraries "$RUNNER_TEMP/has-libraries"
          cp -r "$RUNNER_TEMP/has-libraries/HAS2_Wifi" "$LIB_DIR/HAS2_Wifi"
          git -C "$RUNNER_TEMP/has-libraries" log -1 --format='HAS2_Wifi dependency: %H'
          git clone --depth 1 https://github.com/marcelloromani/Arduino-SimpleTimer "$RUNNER_TEMP/simpletimer-src"
          cp -r "$RUNNER_TEMP/simpletimer-src/SimpleTimer" "$LIB_DIR/SimpleTimer"
      - name: Write compile-only secrets (public placeholders)
        env:
          BLACKBOX: ${{ matrix.blackbox }}
        run: |
          {
            echo '#pragma once'
            echo '#define HMAC_SECRET "__COMPILE_ONLY_DO_NOT_DEPLOY__"'
            if [ "$BLACKBOX" = "mqtt" ]; then
              echo '#define HAS1_ALTAR_BLACKBOX_BROKER_URI "mqtt://172.30.1.43:1883"'
              echo '#define HAS1_ALTAR_BLACKBOX_MQTT_PASSWORD "__COMPILE_ONLY_DO_NOT_DEPLOY__"'
            fi
          } > devices/HAS1_altar/secrets.h
      - name: Compile (never deploy)
        run: |
          python3 scripts/firmware_targets.py HAS1_altar >> "$GITHUB_ENV"
          eval "$(python3 scripts/firmware_targets.py HAS1_altar)"
          mkdir -p "$RUNNER_TEMP/altar-build"
          arduino-cli compile --fqbn "$FQBN" --warnings default \
            --library "$GITHUB_WORKSPACE/libraries/HAS1BlackBox" \
            --output-dir "$RUNNER_TEMP/altar-build" "$DEVICE_DIR"
      - name: Check blackbox code and OTA slot margin
        env:
          BLACKBOX: ${{ matrix.blackbox }}
        run: |
          APP_BIN=$(find "$RUNNER_TEMP/altar-build" -maxdepth 1 -name '*.ino.bin' -print -quit)
          APP_SIZE=$(stat -c '%s' "$APP_BIN")
          SLOT_SIZE=$((0x1E0000))
          echo "Altar app image: $APP_SIZE bytes / OTA slot: $SLOT_SIZE bytes"
          if [ "$APP_SIZE" -gt "$((SLOT_SIZE - 64 * 1024))" ]; then
            echo "OTA slot safety margin is below 64 KiB"
            exit 1
          fi
          for marker in bb-writer device.boot altar.sw.click altar.solenoid.on; do
            grep -a -q "$marker" "$APP_BIN" || { echo "Compiled image lacks $marker"; exit 1; }
          done
          if [ "$BLACKBOX" = "mqtt" ]; then
            grep -a -q "mqtt://172.30.1.43:1883" "$APP_BIN" || { echo "MQTT build lacks the broker URI"; exit 1; }
          elif grep -a -q "mqtt://172.30.1.43:1883" "$APP_BIN"; then
            echo "Flash-only build unexpectedly embeds a broker URI"
            exit 1
          fi
